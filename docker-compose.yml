services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    env_file:
      - path: .env
        required: false
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./cache:/app/cache
      - ./database:/app/database
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped
